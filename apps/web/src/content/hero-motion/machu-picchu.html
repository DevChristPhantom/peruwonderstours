<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machu Picchu | Motion</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#091b2b}body{font-family:Georgia,serif}.hero{position:relative;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;cursor:crosshair}.scene{position:absolute;inset:-3%;background-image:url('/hero-motion/machu-picchu-0.webp');background-position:center;background-size:cover;will-change:transform;transform:scale(1.04)}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,26,51,.08),transparent 60%)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.title-reveal{position:absolute;top:0;left:0;width:58%;height:30%;pointer-events:none;overflow:hidden;z-index:2;animation:reveal 2.6s cubic-bezier(.25,.8,.2,1) both;mask-image:linear-gradient(90deg,black 0%,black 85%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,black 0%,black 85%,transparent 100%)}.title-reveal:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.26) 51%,transparent 65%);transform:translateX(-130%);animation:shine 2.4s 1s ease-out both;mix-blend-mode:screen}.title-reveal .copy{position:absolute;inset:0;background-image:url('/hero-motion/machu-picchu-0.webp');background-size:calc(100vw * 1.06) calc(100dvh * 1.06);background-position:center;transform:translate3d(0,0,0)}@keyframes reveal{from{clip-path:inset(0 100% 0 0);opacity:.6}to{clip-path:inset(0 0 0 0);opacity:1}}@keyframes shine{to{transform:translateX(140%)}}.veil{position:absolute;left:0;top:0;width:57%;height:31%;z-index:2;pointer-events:none;background:linear-gradient(180deg,#0871bd 0%,#377fb8 45%,#92a3a2 100%);animation:unveil 2.7s .25s cubic-bezier(.24,.85,.2,1) both;mask-image:linear-gradient(to bottom,black 60%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,black 60%,transparent 100%)}@keyframes unveil{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}.ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 45%,rgba(255,211,141,.08),transparent 60%);mix-blend-mode:screen}@media(prefers-reduced-motion:reduce){.title-reveal,.title-reveal:after{animation:none!important}}@media(max-width:700px){.scene{background-position:59% center}.title-reveal{width:100%;height:28%}}
</style></head><body><main class="hero" id="hero" aria-label="Machu Picchu, Cusco, Perú"><div class="scene" id="scene"></div><div class="shade"></div><div class="veil" id="veil"></div><div class="ambient"></div><canvas id="fx"></canvas></main><script>
const hero=document.querySelector('#hero'),scene=document.querySelector('#scene'),canvas=document.querySelector('#fx'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,tx=0,ty=0,cx=0,cy=0,particles=[],last=null,active=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=hero.clientWidth;h=hero.clientHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
function puff(x,y,vx,vy){if(particles.length>280)particles.splice(0,particles.length-280);particles.push({x:x+rand(-10,10),y:y+rand(-10,10),vx:rand(-.5,.5)-vx*.055,vy:rand(-.65,-.2)-vy*.055,r:rand(11,25),life:0,max:rand(95,150),alpha:rand(.10,.23)})}
hero.addEventListener('pointermove',e=>{let r=hero.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;tx=(x/w-.5)*-17;ty=(y/h-.5)*-12;if(last){let dx=x-last.x,dy=y-last.y,n=Math.min(9,Math.max(1,Math.ceil(Math.hypot(dx,dy)/11)));for(let i=0;i<n;i++){let f=(i+1)/n;for(let k=0;k<2;k++)puff(last.x+dx*f,last.y+dy*f,dx,dy)}}else{for(let k=0;k<7;k++)puff(x,y,0,0)}last={x,y};active=true});hero.addEventListener('pointerleave',()=>{last=null;tx=ty=0;active=false});
let frame=0;function animate(){requestAnimationFrame(animate);cx+=(tx-cx)*.045;cy+=(ty-cy)*.045;scene.style.transform=`translate3d(${cx}px,${cy}px,0) scale(1.04)`;ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='screen';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life++;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.vy-=.002;p.r+=.23;let t=p.life/p.max;if(t>=1){particles.splice(i,1);continue}let a=p.alpha*Math.sin(Math.PI*Math.pow(t,.67));let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(244,249,255,${a})`);g.addColorStop(.42,`rgba(231,242,255,${a*.58})`);g.addColorStop(1,'rgba(232,244,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';frame++}animate();
</script></body></html>
